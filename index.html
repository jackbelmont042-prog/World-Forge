    <script>
      // Suppress benign Vite HMR WebSocket disconnect messages in embedded iframe
      window.addEventListener('error', function(event) {
        if (event && event.message && (event.message.includes('WebSocket') || event.message.includes('vite'))) {
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && event.reason.message && (event.reason.message.includes('WebSocket') || event.reason.message.includes('vite'))) {
          event.stopImmediatePropagation();
        }
      });
    </script>
