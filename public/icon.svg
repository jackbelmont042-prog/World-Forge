<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="100%" stop-color="#0a0c10" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a3" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8c6d23" />
    </linearGradient>
    <linearGradient id="runeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2bc68" />
      <stop offset="100%" stop-color="#936c1e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Ring with Compass Marks -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="14 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#2a3344" stroke-width="1.5" />

  <!-- Compass Star / Forge Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- 8-pointed Cartographer Star -->
    <path d="M 0 -130 L 18 -35 L 110 0 L 18 35 L 0 130 L -18 35 L -110 0 L -18 -35 Z" fill="url(#goldGrad)" />
    <path d="M 0 -130 L 18 -35 L 0 0 Z" fill="#fff3d1" opacity="0.5" />
    <path d="M 110 0 L 18 35 L 0 0 Z" fill="#fff3d1" opacity="0.5" />
    <path d="M 0 130 L -18 35 L 0 0 Z" fill="#fff3d1" opacity="0.5" />
    <path d="M -110 0 L -18 -35 L 0 0 Z" fill="#fff3d1" opacity="0.5" />

    <!-- Diagonal Secondary Points -->
    <path d="M 0 -80 L 12 -22 L 70 0 L 12 22 L 0 80 L -12 22 L -70 0 L -12 -22 Z" transform="rotate(45)" fill="url(#runeGrad)" opacity="0.75" />
    
    <!-- Central World Sphere / Orb -->
    <circle cx="0" cy="0" r="42" fill="#0d1117" stroke="url(#goldGrad)" stroke-width="3.5" />
    <!-- Lat/Long Graticule Lines -->
    <ellipse cx="0" cy="0" rx="42" ry="18" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.7" />
    <ellipse cx="0" cy="0" rx="18" ry="42" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.7" />
    <circle cx="0" cy="0" r="10" fill="#f5e0a3" />
  </g>

  <!-- Cardinal Coordinates text decoration -->
  <text x="256" y="55" font-family="'Cinzel', serif" font-size="20" font-weight="700" fill="#d4af37" text-anchor="middle" letter-spacing="4">N</text>
  <text x="256" y="475" font-family="'Cinzel', serif" font-size="20" font-weight="700" fill="#d4af37" text-anchor="middle" letter-spacing="4">S</text>
  <text x="465" y="263" font-family="'Cinzel', serif" font-size="20" font-weight="700" fill="#d4af37" text-anchor="middle">E</text>
  <text x="48" y="263" font-family="'Cinzel', serif" font-size="20" font-weight="700" fill="#d4af37" text-anchor="middle">W</text>
</svg>
